# Branch-only variant of the sync workflow: exports a date range to a
# short-lived artifact. Not for merging.
name: Garmin morning sync

on:
  workflow_dispatch:
    inputs:
      start:
        required: true
      end:
        required: true

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # main in the workspace root, so a refreshed session is saved back to main
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          path: _export

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install garminconnect
        run: pip install "garminconnect>=0.3.17" cryptography

      - name: Export Garmin range
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          PYTHONPATH: garmin-sync
        run: >
          python _export/garmin-sync/export_range.py
          --start "${{ inputs.start }}" --end "${{ inputs.end }}"
          --out "$RUNNER_TEMP/garmin_export.json"

      - uses: actions/upload-artifact@v4
        with:
          name: garmin-export
          path: ${{ runner.temp }}/garmin_export.json
          retention-days: 1

      - name: Save refreshed Garmin session to main if it changed
        run: |
          git config user.name "garmin-sync"
          git config user.email "actions@github.com"
          if [ -f garmin-sync/session.enc ]; then git add garmin-sync/session.enc; fi
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Garmin session refresh $(date -u +%F)"
          git push
